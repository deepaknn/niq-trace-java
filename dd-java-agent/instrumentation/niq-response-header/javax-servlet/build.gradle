muzzle {
  pass {
    name = 'servlet-3.x'
    group = "javax.servlet"
    module = 'javax.servlet-api'
    versions = "[3.0,)"
    assertInverse = true
  }
}

apply from: "$rootDir/gradle/java.gradle"

dependencies {
  compileOnly group: 'javax.servlet', name: 'javax.servlet-api', version: '3.0.1'
}
